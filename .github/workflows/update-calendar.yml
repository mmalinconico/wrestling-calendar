name: Update Wrestling Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

concurrency:
  group: wrestling-calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Python files
        run: python -m py_compile fetch_events.py generate_calendar.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch events
        run: python fetch_events.py

      - name: Generate calendar
        run: python generate_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/events.json calendar.ics

          git diff --staged --quiet || (
            git commit -m "Update calendar"
            git push
          )
